

################################################## LDAP #####################################################
################### requires SA-Ldapsearch app from splunkbase to perform "ldapsearch" ######################
############################################### all users ###################################################
[query:ldap - all user and computers]
cron_schedule = 00 1 * * 4
enableSched = 1
realtime_schedule = 0
request.ui_dispatch_app = AD_dashboard_searchhead
request.ui_dispatch_view = search   
search = | ldapsearch search="(|(objectClass=user)(objectClass=computer))" attrs="uSNChanged, lastLogonTimestamp, sAMAccountName, distinguishedName, userAccountControl, whenCreated, personalTitle, displayName, givenName, sn, mail, telephoneNumber, accountExpires, memberOf, objectCategory, proxyAddresses, msExchMailboxAuditLastAdminAccess, msExchccMailConnectAsPassword, msExchRecipientTypeDetails, msExchMobileMailboxFlags, protocolSettings, whenChanged, msExchRBACPolicyLink, employeeID, mobile, msExchWhenMailboxCreated, msExchUserAccountControl, title, msExchArchiveQuota, msRTCSIP-UserRoutingGroupId, userAccountControl, msExchArchiveWarnQuota, msExchMDBRulesQuota, description, objectGUID, msRTCSIP-InternetAccessEnabled, company, msExchUMEnabledFlags2, logonCount, lastLogon, pwdLastSet, msExchHomeServerName, objectSid, msRTCSIP-UserEnabled, msExchMailboxAuditEnable, badPwdCount, badPasswordTime, msExchELCMailboxFlags, primaryGroupID,sIDHistory,msExchMasterAccountSid,lastLogoff,msDS-KeyCredentialLink,msDS-AllowedToDelegateTo,whenChanged,msExchRecipientTypeDetails,uSNCreated,msDS-LastKnownRDN,department,cn,dNSHostName,extensionAttribute10,msDS-SupportedEncryptionTypes,ms-Mcs-AdmPwdExpirationTime,servicePrincipalName,objectclass" | outputlookup all-dc-users-comp-selectedattributes.csv


################################################ all dc groups ################################################
[query:ldap - all dc groups]
cron_schedule = 00 3 * * 4
enableSched = 1
realtime_schedule = 0
search = | ldapsearch search="(objectClass=group)" attrs="cn,distinguishedName,sAMAccountName" \
| ldapgroup \
| outputlookup all-dc-groups.csv 



